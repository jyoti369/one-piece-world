<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The World As You Know It</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #131a30;
    --panel2: #1a2340;
    --ink: #e8ecf8;
    --muted: #8b94b0;
    --accent: #f5c542;
    --line: #2a3558;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px 8px;
    background: linear-gradient(180deg, #10172e, var(--bg));
    border-bottom: 1px solid var(--line);
    z-index: 5;
  }
  .toprow { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 19px; letter-spacing: 0.5px; }
  h1 .gold { color: var(--accent); }
  .sub { color: var(--muted); font-size: 12px; }
  .controls {
    display: flex; align-items: center; gap: 12px;
    margin-top: 8px; flex-wrap: wrap;
  }
  .epbox {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 10px;
  }
  .epbox label { font-size: 12px; color: var(--muted); }
  #epnum {
    font-size: 20px; font-weight: 700; color: var(--accent);
    min-width: 52px; text-align: right; font-variant-numeric: tabular-nums;
  }
  button {
    background: var(--panel2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #1a1408; font-weight: 700; border: none; }
  #search {
    background: var(--panel); border: 1px solid var(--line);
    color: var(--ink); border-radius: 8px; padding: 7px 12px;
    font-size: 13px; width: 190px;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  .sliderwrap { flex: 1; min-width: 260px; position: relative; padding-top: 14px; }
  #slider { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .arcticks { position: absolute; top: 0; left: 0; right: 0; height: 13px; }
  .arcticks span {
    position: absolute; font-size: 9px; color: var(--muted);
    transform: translateX(-50%); white-space: nowrap;
  }
  #stage { flex: 1; position: relative; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #tooltip {
    position: absolute; pointer-events: none; display: none;
    background: rgba(19,26,48,0.95); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; z-index: 8;
    max-width: 240px;
  }
  #tooltip .tt-name { font-weight: 700; color: var(--accent); }
  #card {
    position: absolute; top: 12px; right: 12px; width: 290px;
    max-height: calc(100% - 24px); overflow-y: auto;
    background: rgba(19,26,48,0.97); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; display: none; z-index: 9;
  }
  #card h2 { font-size: 17px; color: var(--accent); }
  #c-portrait {
    display: none; width: 88px; height: 88px; border-radius: 50%;
    object-fit: cover; object-position: top; float: right;
    margin: 0 0 8px 10px; border: 3px solid var(--line);
    background: var(--panel2);
  }
  #card .epithet { font-style: italic; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  #card .meta { font-size: 12px; color: var(--muted); margin: 8px 0; line-height: 1.7; }
  #card .meta b { color: var(--ink); font-weight: 600; }
  #card .desc { font-size: 13px; line-height: 1.55; margin: 8px 0; }
  #card .rels { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  #card .rels h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; }
  #card .rel { font-size: 12px; padding: 3px 0; line-height: 1.4; }
  #card .rel .who { color: var(--accent); cursor: pointer; }
  #card .rel .ep { color: var(--muted); font-size: 10px; }
  #card .close { position: absolute; top: 8px; right: 12px; background: none; border: none; color: var(--muted); font-size: 18px; padding: 2px 6px; }
  #legend {
    position: absolute; bottom: 12px; left: 12px; z-index: 7;
    background: rgba(19,26,48,0.9); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; font-size: 11px;
    display: grid; grid-template-columns: repeat(2, auto); gap: 3px 14px;
  }
  #legend .li { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  #legend .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  #counter {
    position: absolute; bottom: 12px; right: 12px; z-index: 7;
    background: rgba(19,26,48,0.9); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 14px; font-size: 12px; color: var(--muted);
    text-align: right;
  }
  #counter b { color: var(--accent); font-size: 16px; }
  #toast {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(19,26,48,0.95); border: 1px solid var(--accent);
    border-radius: 20px; padding: 6px 18px; font-size: 13px;
    display: none; z-index: 10; white-space: nowrap;
  }
  #modal-bg {
    position: fixed; inset: 0; background: rgba(5,8,18,0.85);
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  #modal {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 28px; text-align: center;
    width: min(340px, calc(100vw - 32px)); margin: auto;
  }
  #modal h2 { color: var(--accent); margin-bottom: 8px; font-size: 18px; }
  #modal p { color: var(--muted); font-size: 13px; line-height: 1.6; margin-bottom: 16px; }
  #modal input {
    background: var(--bg); border: 1px solid var(--line); color: var(--accent);
    font-size: 26px; font-weight: 700; text-align: center;
    border-radius: 10px; padding: 8px; width: 130px; margin-bottom: 16px;
  }
  #modal .note { font-size: 11px; color: var(--muted); margin-top: 12px; }
  #results {
    position: absolute; z-index: 20; display: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    max-height: 220px; overflow-y: auto; min-width: 190px;
  }
  #results div { padding: 6px 12px; font-size: 13px; cursor: pointer; }
  #results div:hover { background: var(--panel2); }
  #results .nomatch { color: var(--muted); cursor: default; }
  @media (max-width: 640px) {
    header { padding: 8px 10px; }
    .controls { gap: 8px; }
    .arcticks { display: none; }
    .sliderwrap { padding-top: 0; min-width: 100%; order: 5; }
    .epbox { padding: 4px 8px; }
    #epnum { font-size: 16px; min-width: 40px; }
    #search { width: 110px; flex: 1; }
    #card { width: calc(100% - 24px); max-height: 55%; }
    #legend { display: none; }
    h1 { font-size: 16px; }
    .sub { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="toprow">
    <h1>The World <span class="gold">As You Know It</span></h1>
    <span class="sub">the One Piece world, grown only as far as you've watched</span>
  </div>
  <div class="controls">
    <div class="epbox">
      <label>Episode</label>
      <span id="epnum">1</span>
    </div>
    <button id="playbtn" class="primary">▶ Play</button>
    <div class="sliderwrap">
      <div class="arcticks" id="arcticks"></div>
      <input type="range" id="slider" min="1" max="589" value="1">
    </div>
    <input type="text" id="search" placeholder="Search a character…" autocomplete="off">
    <button id="setep" title="Change how far you've watched">⚙ My episode</button>
  </div>
</header>

<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="tooltip"></div>
  <div id="card">
    <button class="close" id="cardclose">✕</button>
    <img id="c-portrait" alt="">
    <h2 id="c-name"></h2>
    <div class="epithet" id="c-epithet"></div>
    <div class="meta" id="c-meta"></div>
    <div class="desc" id="c-desc"></div>
    <div class="rels"><h3>Connections you've seen</h3><div id="c-rels"></div></div>
  </div>
  <div id="legend"></div>
  <div id="counter"></div>
  <div id="toast"></div>
  <div id="results"></div>
</div>

<div id="modal-bg">
  <div id="modal">
    <h2>Where are you in the story?</h2>
    <p>Set the last episode you've watched. The world will never show you anyone or anything past it.</p>
    <input type="number" id="myep" min="1" max="589" value="589">
    <br>
    <button class="primary" id="modalgo">Set sail</button>
    <div class="note">Data currently covers up to episode 589. Saved on this device.</div>
  </div>
</div>

<script>
// ---------------- state ----------------
const byId = {};
CHARS.forEach(c => byId[c[0]] = {
  id:c[0], name:c[1], epithet:c[2], debut:c[3], faction:c[4], size:c[5],
  bounties:c[6], blurb:c[7], x:0, y:0, vx:0, vy:0, placed:false, born:0
});
const NODES = Object.values(byId);
const EDGES = LINKS.map(l => ({a:byId[l[0]], b:byId[l[1]], type:l[2], ep:l[3], label:l[4]}));

let myEp = parseInt(localStorage.getItem("opw_myep") || "0", 10);
let ep = parseInt(localStorage.getItem("opw_slider") || "1", 10);
let playing = false;
let selected = null;
let hovered = null;
let cam = {x:0, y:0, z:1};
let lastCount = 0;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const slider = document.getElementById("slider");
const epnum = document.getElementById("epnum");
const tooltip = document.getElementById("tooltip");

// deterministic pseudo-random from id so layout is stable across loads
function hashf(s, salt) {
  let h = 2166136261 ^ salt;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 10000) / 10000;
}

function seedNode(n) {
  // spawn near an already-visible connection if one exists, else on a spiral by debut
  const anchor = EDGES.find(e => e.ep <= ep &&
    ((e.a === n && e.b.placed) || (e.b === n && e.a.placed)));
  if (anchor) {
    const other = anchor.a === n ? anchor.b : anchor.a;
    n.x = other.x + (hashf(n.id,1) - 0.5) * 120;
    n.y = other.y + (hashf(n.id,2) - 0.5) * 120;
  } else {
    const t = n.debut * 0.045 + hashf(n.id,3) * 6.28;
    const r = 140 + n.debut * 0.55;
    n.x = Math.cos(t) * r;
    n.y = Math.sin(t) * r;
  }
  n.vx = n.vy = 0;
  n.placed = true;
  n.born = performance.now();
}

function visibleNodes() { return NODES.filter(n => n.debut <= ep); }
function visibleEdges() { return EDGES.filter(e => e.ep <= ep); }

function syncPlacement() {
  const vis = visibleNodes();
  vis.forEach(n => { if (!n.placed) seedNode(n); });
  NODES.forEach(n => { if (n.debut > ep) n.placed = false; });
  if (vis.length !== lastCount) lastCount = vis.length;
}

// ---------------- physics ----------------
function tick() {
  const vis = NODES.filter(n => n.placed);
  const edges = visibleEdges();
  // repulsion
  for (let i = 0; i < vis.length; i++) {
    for (let j = i + 1; j < vis.length; j++) {
      const a = vis[i], b = vis[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx*dx + dy*dy;
      if (d2 < 1) { dx = hashf(a.id,4) - 0.5; dy = hashf(b.id,5) - 0.5; d2 = 1; }
      if (d2 > 160000) continue;
      const f = 1400 / d2;
      const d = Math.sqrt(d2);
      const fx = dx / d * f, fy = dy / d * f;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
  }
  // springs
  edges.forEach(e => {
    if (!e.a.placed || !e.b.placed) return;
    const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    const rest = 90 + (e.a.size + e.b.size) * 8;
    const f = (d - rest) * 0.004;
    const fx = dx / d * f, fy = dy / d * f;
    e.a.vx += fx; e.a.vy += fy; e.b.vx -= fx; e.b.vy -= fy;
  });
  // gravity to center + integrate
  vis.forEach(n => {
    n.vx -= n.x * 0.0012; n.vy -= n.y * 0.0012;
    n.vx *= 0.86; n.vy *= 0.86;
    n.x += n.vx; n.y += n.vy;
  });
}

// ---------------- portraits ----------------
const IMG_CACHE = {};
function portrait(n) {
  if (!IMGS[n.id]) return null;
  let c = IMG_CACHE[n.id];
  if (!c) {
    c = IMG_CACHE[n.id] = { img: new Image(), ok: false };
    c.img.onload = () => { c.ok = true; };
    c.img.src = IMG_BASE + IMGS[n.id];
  }
  return c.ok ? c.img : null;
}

// ---------------- render ----------------
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  canvas.width = r.width * dpr;
  canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);

function worldToScreen(x, y) {
  const r = canvas.getBoundingClientRect();
  return [r.width/2 + (x - cam.x) * cam.z, r.height/2 + (y - cam.y) * cam.z];
}
function screenToWorld(px, py) {
  const r = canvas.getBoundingClientRect();
  return [(px - r.width/2) / cam.z + cam.x, (py - r.height/2) / cam.z + cam.y];
}
function nodeR(n) { return (7 + n.size * 3.8); }

function draw() {
  const r = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  const now = performance.now();
  const edges = visibleEdges();
  const conn = selected ? new Set(edges.filter(e => e.a === selected || e.b === selected)
    .flatMap(e => [e.a.id, e.b.id])) : null;

  edges.forEach(e => {
    if (!e.a.placed || !e.b.placed) return;
    const [x1, y1] = worldToScreen(e.a.x, e.a.y);
    const [x2, y2] = worldToScreen(e.b.x, e.b.y);
    const dim = selected && e.a !== selected && e.b !== selected;
    ctx.strokeStyle = LINKCOLORS[e.type] || "#607094";
    ctx.globalAlpha = dim ? 0.06 : (e.type === "meet" ? 0.25 : 0.42);
    ctx.lineWidth = e.type === "crew" ? 1.8 : 1.1;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  });
  ctx.globalAlpha = 1;

  NODES.filter(n => n.placed).forEach(n => {
    const [x, y] = worldToScreen(n.x, n.y);
    const rad = nodeR(n) * cam.z;
    const age = now - n.born;
    const flash = age < 1200 ? (1 - age / 1200) : 0;
    const dim = selected && n !== selected && !(conn && conn.has(n.id));
    const col = FACTIONS[n.faction].color;

    if (flash > 0) {
      ctx.beginPath();
      ctx.arc(x, y, rad + 14 * flash, 0, 6.29);
      ctx.strokeStyle = "#f5c542";
      ctx.globalAlpha = flash * 0.8;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    const img = portrait(n);
    ctx.globalAlpha = dim ? 0.15 : 1;
    if (img) {
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.29); ctx.clip();
      // square crop biased toward the top of the portrait, where the face is
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      const sy = (img.naturalHeight - s) * 0.12;
      ctx.fillStyle = "#1a2340";
      ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
      ctx.drawImage(img, (img.naturalWidth - s) / 2, sy, s, s, x - rad, y - rad, rad * 2, rad * 2);
      ctx.restore();
      ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.29);
      ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, rad * 0.12); ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, 6.29);
      ctx.fillStyle = col;
      ctx.fill();
    }
    if (n === selected || n === hovered) {
      ctx.beginPath(); ctx.arc(x, y, rad + 1, 0, 6.29);
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
    }
    // labels: big names always, others when zoomed or highlighted
    if (!dim && (n.size >= 3 || cam.z > 1.25 || n === hovered || n === selected || flash > 0)) {
      ctx.fillStyle = dim ? "rgba(232,236,248,0.2)" : "rgba(232,236,248,0.92)";
      ctx.font = `${n.size >= 3 ? "600 " : ""}${Math.max(10, 11 * Math.min(cam.z, 1.4))}px -apple-system, sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(n.name, x, y + rad + 13);
    }
    ctx.globalAlpha = 1;
  });
}

function frame() {
  syncPlacement();
  tick(); tick();
  draw();
  if (playing) {
    playFrames++;
    if (playFrames % 4 === 0) setEpisode(Math.min(ep + 1, myEp));
    if (ep >= myEp) setPlaying(false);
  }
  requestAnimationFrame(frame);
}
let playFrames = 0;

// ---------------- controls ----------------
function setEpisode(v, fromSlider) {
  ep = Math.max(1, Math.min(v, myEp));
  if (!fromSlider) slider.value = ep;
  epnum.textContent = ep;
  localStorage.setItem("opw_slider", ep);
  updateCounter();
  if (selected && selected.debut > ep) closeCard();
  if (selected) openCard(selected); // refresh bounty/relations for new ep
}
function updateCounter() {
  const n = visibleNodes().length, e = visibleEdges().length;
  document.getElementById("counter").innerHTML =
    `<b>${n}</b> characters met<br>${e} connections known`;
}
function setPlaying(on) {
  playing = on;
  document.getElementById("playbtn").textContent = on ? "❚❚ Pause" : "▶ Play";
  if (on && ep >= myEp) setEpisode(1);
}
document.getElementById("playbtn").onclick = () => setPlaying(!playing);
slider.addEventListener("input", () => { setPlaying(false); setEpisode(parseInt(slider.value,10), true); });

function applyMyEp(v) {
  myEp = Math.max(1, Math.min(v || DATA_MAX_EP, DATA_MAX_EP));
  localStorage.setItem("opw_myep", myEp);
  slider.max = myEp;
  if (ep > myEp) setEpisode(myEp);
  buildArcTicks();
}
document.getElementById("modalgo").onclick = () => {
  applyMyEp(parseInt(document.getElementById("myep").value, 10));
  document.getElementById("modal-bg").style.display = "none";
  setEpisode(myEp);
  toast(`The world as of episode ${myEp}. Drag the timeline to travel back.`);
};
document.getElementById("setep").onclick = () => {
  document.getElementById("myep").value = myEp;
  document.getElementById("modal-bg").style.display = "flex";
};

function buildArcTicks() {
  const el = document.getElementById("arcticks");
  el.innerHTML = "";
  ARCS.forEach(([e, name]) => {
    if (e > myEp) return;
    const s = document.createElement("span");
    s.textContent = name;
    s.style.left = ((e - 1) / Math.max(myEp - 1, 1) * 100) + "%";
    el.appendChild(s);
  });
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = "none", 3500);
}

// ---------------- card ----------------
function fmtBounty(v) {
  if (v < 1000) return v + " berries";
  return v.toLocaleString("en-US") + " berries";
}
function openCard(n) {
  selected = n;
  const pimg = document.getElementById("c-portrait");
  if (IMGS[n.id]) {
    pimg.src = IMG_BASE + IMGS[n.id];
    pimg.style.borderColor = FACTIONS[n.faction].color;
    pimg.style.display = "block";
    pimg.onerror = () => { pimg.style.display = "none"; };
  } else {
    pimg.style.display = "none";
  }
  document.getElementById("c-name").textContent = n.name;
  document.getElementById("c-epithet").textContent = n.epithet ? `“${n.epithet}”` : "";
  let bounty = null;
  if (n.bounties) n.bounties.forEach(([be, bv]) => { if (be <= ep) bounty = bv; });
  document.getElementById("c-meta").innerHTML =
    `<b>${FACTIONS[n.faction].name}</b><br>` +
    `First seen: episode <b>${n.debut}</b><br>` +
    (bounty !== null ? `Bounty (as of ep ${ep}): <b>${fmtBounty(bounty)}</b>` : `Bounty: <span style="opacity:.6">none known yet</span>`);
  document.getElementById("c-desc").textContent = n.blurb;
  const rels = visibleEdges().filter(e => e.a === n || e.b === n)
    .sort((x, y) => x.ep - y.ep);
  document.getElementById("c-rels").innerHTML = rels.length
    ? rels.map(e => {
        const other = e.a === n ? e.b : e.a;
        return `<div class="rel"><span class="who" data-id="${other.id}">${other.name}</span>` +
          ` — ${e.label} <span class="ep">(ep ${e.ep})</span></div>`;
      }).join("")
    : `<div class="rel" style="color:var(--muted)">No connections known yet.</div>`;
  document.getElementById("card").style.display = "block";
  document.querySelectorAll("#c-rels .who").forEach(el => {
    el.onclick = () => { const t = byId[el.dataset.id]; if (t && t.debut <= ep) { openCard(t); focusNode(t); } };
  });
}
function closeCard() { selected = null; document.getElementById("card").style.display = "none"; }
document.getElementById("cardclose").onclick = closeCard;

function focusNode(n) {
  cam.x = n.x; cam.y = n.y;
  if (cam.z < 1.2) cam.z = 1.2;
}

// ---------------- search (partial, case-insensitive) ----------------
const searchEl = document.getElementById("search");
const resultsEl = document.getElementById("results");
function runSearch() {
  const q = searchEl.value.trim().toLowerCase();
  if (!q) { resultsEl.style.display = "none"; return; }
  const hits = visibleNodes().filter(n =>
    n.name.toLowerCase().includes(q) || (n.epithet && n.epithet.toLowerCase().includes(q))
  ).slice(0, 12);
  const hidden = NODES.filter(n => n.debut > ep &&
    (n.name.toLowerCase().includes(q) || (n.epithet && n.epithet.toLowerCase().includes(q)))).length;
  resultsEl.innerHTML = hits.map(n =>
    `<div data-id="${n.id}">${n.name}${n.epithet ? ` <span style="color:var(--muted);font-size:11px">“${n.epithet}”</span>` : ""}</div>`
  ).join("") +
  (hits.length === 0 ? `<div class="nomatch">No one you've met matches that.</div>` : "") +
  (hidden > 0 ? `<div class="nomatch">🔒 ${hidden} more exist${hidden===1?"s":""} beyond episode ${ep}…</div>` : "");
  const r = searchEl.getBoundingClientRect();
  const stage = document.getElementById("stage").getBoundingClientRect();
  resultsEl.style.left = (r.left - stage.left) + "px";
  resultsEl.style.top = "4px";
  resultsEl.style.display = "block";
  resultsEl.querySelectorAll("div[data-id]").forEach(el => {
    el.onclick = () => {
      const n = byId[el.dataset.id];
      resultsEl.style.display = "none"; searchEl.value = "";
      openCard(n); focusNode(n);
    };
  });
}
searchEl.addEventListener("input", runSearch);
searchEl.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const first = resultsEl.querySelector("div[data-id]");
    if (first) first.click();
  }
  if (e.key === "Escape") { resultsEl.style.display = "none"; searchEl.blur(); }
});
document.addEventListener("click", e => {
  if (!resultsEl.contains(e.target) && e.target !== searchEl) resultsEl.style.display = "none";
});

// ---------------- pointer ----------------
let dragging = false, dragMoved = false, lastP = null;
function pickNode(px, py) {
  const [wx, wy] = screenToWorld(px, py);
  let best = null, bd = 1e9;
  NODES.filter(n => n.placed).forEach(n => {
    const dx = n.x - wx, dy = n.y - wy;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < nodeR(n) / Math.min(cam.z,1) + 6 && d < bd) { bd = d; best = n; }
  });
  return best;
}
canvas.addEventListener("mousedown", e => {
  dragging = true; dragMoved = false;
  lastP = [e.offsetX, e.offsetY];
  canvas.classList.add("dragging");
});
window.addEventListener("mouseup", () => { dragging = false; canvas.classList.remove("dragging"); });
canvas.addEventListener("mousemove", e => {
  if (dragging) {
    const dx = e.offsetX - lastP[0], dy = e.offsetY - lastP[1];
    if (Math.abs(dx) + Math.abs(dy) > 2) dragMoved = true;
    cam.x -= dx / cam.z; cam.y -= dy / cam.z;
    lastP = [e.offsetX, e.offsetY];
    return;
  }
  hovered = pickNode(e.offsetX, e.offsetY);
  if (hovered) {
    tooltip.style.display = "block";
    tooltip.style.left = (e.offsetX + 14) + "px";
    tooltip.style.top = (e.offsetY + 10) + "px";
    tooltip.innerHTML = `<span class="tt-name">${hovered.name}</span>` +
      (hovered.epithet ? ` <span style="color:var(--muted)">“${hovered.epithet}”</span>` : "") +
      `<br><span style="color:var(--muted)">first seen ep ${hovered.debut} · click for details</span>`;
    canvas.style.cursor = "pointer";
  } else {
    tooltip.style.display = "none";
    canvas.style.cursor = dragging ? "grabbing" : "grab";
  }
});
canvas.addEventListener("click", e => {
  if (dragMoved) return;
  const n = pickNode(e.offsetX, e.offsetY);
  if (n) { openCard(n); } else { closeCard(); }
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 0.9;
  cam.z = Math.max(0.3, Math.min(3.5, cam.z * f));
}, { passive: false });

// touch: one-finger pan, tap to select
let touchStart = null;
canvas.addEventListener("touchstart", e => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    const r = canvas.getBoundingClientRect();
    touchStart = lastP = [t.clientX - r.left, t.clientY - r.top];
    dragMoved = false;
  }
}, { passive: true });
canvas.addEventListener("touchmove", e => {
  if (e.touches.length === 1 && lastP) {
    const t = e.touches[0];
    const r = canvas.getBoundingClientRect();
    const p = [t.clientX - r.left, t.clientY - r.top];
    cam.x -= (p[0] - lastP[0]) / cam.z; cam.y -= (p[1] - lastP[1]) / cam.z;
    if (Math.abs(p[0]-touchStart[0]) + Math.abs(p[1]-touchStart[1]) > 6) dragMoved = true;
    lastP = p;
  }
}, { passive: true });
canvas.addEventListener("touchend", () => {
  if (!dragMoved && touchStart) {
    const n = pickNode(touchStart[0], touchStart[1]);
    if (n) openCard(n); else closeCard();
  }
  lastP = touchStart = null;
});

// ---------------- legend ----------------
(function () {
  const el = document.getElementById("legend");
  Object.values(FACTIONS).forEach(f => {
    const d = document.createElement("div");
    d.className = "li";
    d.innerHTML = `<span class="dot" style="background:${f.color}"></span>${f.name}`;
    el.appendChild(d);
  });
})();

// ---------------- boot ----------------
resize();
if (myEp >= 1) {
  document.getElementById("modal-bg").style.display = "none";
  applyMyEp(myEp);
  setEpisode(Math.min(ep, myEp));
} else {
  // first run: modal stays open; a sane default underneath (persisted on confirm)
  myEp = DATA_MAX_EP;
  slider.max = myEp;
  setEpisode(1);
  buildArcTicks();
  window.addEventListener("keydown", function once(e) {
    if (e.key === "Enter" && document.getElementById("modal-bg").style.display !== "none") {
      document.getElementById("modalgo").click();
      window.removeEventListener("keydown", once);
    }
  });
}
updateCounter();
frame();
</script>
</body>
</html>
